{% extends "base.html" %}{% block content %}<div class="narrow"><p class="eyebrow">DALE UN NUEVO DESTINO</p><h1 class="page-title">Publica tu producto</h1><form class="panel" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Nombre del producto<input name="name" required minlength="3" maxlength="120"></label><label>Descripción<textarea name="description" maxlength="500" rows="3"></textarea></label><label>Categoría<select name="category"><option>Tecnología</option><option>Escritorio</option><option>Accesorios</option></select></label><div class="form-row"><label>Precio en MXN<input name="price" type="number" min="1" max="100000" step=".01" required></label><label>Existencias<input name="stock" type="number" min="1" max="1000" required></label></div><label>Imagen del producto<input name="image" type="file" accept="image/png,image/jpeg,image/webp" required></label><p class="muted">JPG, PNG o WebP, máximo 2 MB. Se almacena de forma privada en S3.</p><button class="button full">Publicar producto ↗</button></form></div>{% endblock %}
