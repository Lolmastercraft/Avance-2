name: mercado-nube
x-runtime: &runtime
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 256m
  pids_limit: 100
  logging:
    driver: json-file
    options: {max-size: 5m, max-file: "2"}
services:
  api:
    <<: *runtime
    build: .
    image: mercado-nube-api:avance2
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configura DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY:?Configura SECRET_KEY}
      PRODUCT_BUCKET: ${PRODUCT_BUCKET:?Configura PRODUCT_BUCKET}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      COOKIE_SECURE: "true"
    networks: [frontend, backend]
  notifications:
    <<: *runtime
    build: .
    image: mercado-nube-notifications:avance2
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configura DATABASE_URL}
    command: [gunicorn, --bind, "0.0.0.0:8000", --workers, "1", --threads, "2", --worker-tmp-dir, /tmp, "app.notifications:create_worker()"]
    depends_on:
      api: {condition: service_healthy}
    networks: [backend]
  proxy:
    <<: *runtime
    image: nginxinc/nginx-unprivileged:1.28.0-alpine
    mem_limit: 64m
    ports: ["80:8080", "443:8443"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/tls:/etc/nginx/tls:ro
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8080/proxy-salud | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [frontend]
networks:
  frontend: {}
  backend: {}
