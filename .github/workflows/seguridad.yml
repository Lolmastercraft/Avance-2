name: Pipeline del Marketplace
on:
  push:
    branches: [main]
    paths-ignore: ['reportes/**', 'entrega/**', 'docs/capturas/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Separar evidencia histórica de la nueva corrida
        run: |
          rm -rf reportes/roja reportes/verde
          rm -f reportes/corrida_roja.txt reportes/corrida_verde.txt reportes/sbom_cyclonedx.json
      - name: Preparar entorno de ejecución y análisis
        run: |
          python -m venv .runtime
          .runtime/bin/pip install --require-hashes -r requirements.txt
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          .venv/bin/pip install Flask==3.1.3 Flask-WTF==1.3.0 Flask-Limiter==4.1.1 SQLAlchemy==2.0.54 psycopg[binary]==3.3.5 Pillow==12.3.0
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Ejecutar candidato rojo y remediación verde
        run: .venv/bin/python pipeline/demostrar.py --runtime-python .runtime/bin/python
      - name: Conservar evidencias incluso si falla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-pipeline
          path: reportes/
      - name: Validar salida para despliegue
        run: python -c "import json; assert json.load(open('reportes/verde/veredicto.json'))['verdict']=='PERMITIR'"
